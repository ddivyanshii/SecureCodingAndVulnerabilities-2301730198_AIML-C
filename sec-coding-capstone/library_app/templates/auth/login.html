{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" autocomplete="on" novalidate>
    {{ csrf_field() }}
    <label class="field"><span>Username</span>
      <input type="text" name="username" value="{{ username }}" maxlength="20" required autofocus autocomplete="username">
    </label>
    <label class="field"><span>Password</span>
      <input type="password" name="password" maxlength="128" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
  <p class="muted">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
